    command: status --format json

  - id: toolchain
    command: 'test -x /Users/mhess/.local/bin/grok && /Users/mhess/.local/bin/grok --version && command -v magick'
    depends_on: [orientation]
    requires_approval: true
    timeout: 30s

  - id: prepare-staging
    command: 'mkdir -p .da/media-staging/raw media/briefs'
